# Sobe a aplicação com MySQL (perfil "prod").
# Uso: copie .env.example para .env, ajuste as senhas e rode "docker compose up --build".
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: portfolio
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/portfolio
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      PORTFOLIO_EMAIL: ${PORTFOLIO_EMAIL:-}
      PORTFOLIO_LINKEDIN: ${PORTFOLIO_LINKEDIN:-}
    ports:
      - "8080:8080"

volumes:
  mysql-data:
